version: "3.9"

# ============================================================
# QuoteBox — Docker Compose (desarrollo local)
# Uso: docker-compose up --build
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Hot-reload en dev: monta el código fuente
      - ./app:/app/app
    # --reload activa hot-reload de Uvicorn al cambiar archivos
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Admin apunta a la API dentro de la red Docker
      FASTAPI_BASE_URL: http://api:8000
    volumes:
      - ./admin:/app
    depends_on:
      - api
    restart: unless-stopped
